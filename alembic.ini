# Alembic configuration for the Deal Desk Reconciler.
#
# The connection URL is resolved at runtime in alembic/env.py from the
# DATABASE_URL environment variable (same source of truth db/session.py
# uses). Keeping sqlalchemy.url empty here prevents committing a secret
# and prevents env/CLI drift.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

# Resolved in env.py. Do not set here.
sqlalchemy.url =

[post_write_hooks]
# No hooks for now. Could add black/ruff on generated migrations later.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
